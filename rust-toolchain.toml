# Harness builds host targets with the Cranelift codegen backend (see
# .cargo/config.toml); stable cargo hard-errors on `[profile.*] codegen-backend`,
# so the whole workspace pins this nightly. It is the same nightly the dylint
# gate already required, so no second toolchain.
#
# rustc-codegen-cranelift: the alternate backend itself. rustc-dev: the dylint
# rule-library gate. rust-src: rust-analyzer + dylint.
[toolchain]
channel = "nightly-2026-08-20"
components = [
    "rustfmt",
    "clippy",
    "rust-src",
    "rustc-dev",
    "rustc-codegen-cranelift-preview",
]
