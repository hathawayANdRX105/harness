<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1280" height="1060" fill="#f8fafc" rx="18"/>

  <text x="640" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Harness Daemon 分层架构</text>
  <text x="640" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">单进程 · 装配 → 传输 → 运行（每会话） → 存储 · 底层为冻结契约</text>

  <!-- ============ 装配层 ============ -->
  <rect x="40" y="76" width="1200" height="118" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="54" y="90" width="86" height="24" rx="12" fill="#7c3aed"/>
  <text x="97" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">装配层</text>

  <rect x="170" y="94" width="250" height="82" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="295" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">harness-config</text>
  <text x="295" y="142" text-anchor="middle" font-size="11" fill="#475569">TOML + env → typed Config</text>
  <text x="295" y="160" text-anchor="middle" font-size="11" fill="#475569">三类 typed 错误 · 掩码密钥</text>

  <rect x="470" y="94" width="250" height="82" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="595" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">harness-builder</text>
  <text x="595" y="142" text-anchor="middle" font-size="11" fill="#475569">HarnessSpec → analyze（拓扑序）</text>
  <text x="595" y="160" text-anchor="middle" font-size="11" fill="#475569">→ assemble · 显式注入无 fallback</text>

  <rect x="770" y="94" width="200" height="82" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="870" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">harness-model</text>
  <text x="870" y="142" text-anchor="middle" font-size="11" fill="#475569">OpenAI 适配器（懒拨号）</text>
  <text x="870" y="160" text-anchor="middle" font-size="11" fill="#475569">host 注入 · aliases 校验</text>

  <rect x="1010" y="94" width="200" height="82" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1110" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">harness-mcp</text>
  <text x="1110" y="142" text-anchor="middle" font-size="11" fill="#475569">stdio/HTTP MCP 服务器池</text>
  <text x="1110" y="160" text-anchor="middle" font-size="11" fill="#475569">mcp__* 桥工具</text>

  <line x1="420" y1="135" x2="468" y2="135" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="444" y="127" text-anchor="middle" font-size="10" fill="#7c3aed">Spec</text>
  <line x1="720" y1="135" x2="768" y2="135" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="970" y1="135" x2="1008" y2="135" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="744" y="127" text-anchor="middle" font-size="10" fill="#7c3aed">model</text>

  <!-- builder 输出标注 -->
  <text x="595" y="186" text-anchor="middle" font-size="10" fill="#7c3aed">输出 AssembledRuntime：tools · limits · policy · 预算 · compactor</text>

  <!-- ============ 传输层 ============ -->
  <rect x="40" y="226" width="1200" height="108" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="54" y="240" width="86" height="24" rx="12" fill="#0284c7"/>
  <text x="97" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">传输层</text>

  <rect x="170" y="240" width="720" height="80" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="530" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">harness-transport · 三通道同一 parse → dispatch → push</text>
  <rect x="190" y="278" width="200" height="28" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="290" y="296" text-anchor="middle" font-size="11" fill="#0369a1">HTTP · /commands + SSE</text>
  <rect x="420" y="278" width="200" height="28" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="520" y="296" text-anchor="middle" font-size="11" fill="#0369a1">WS · subscribe / replay</text>
  <rect x="650" y="278" width="220" height="28" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="760" y="296" text-anchor="middle" font-size="11" fill="#0369a1">UDS · NDJSON control plane</text>

  <rect x="930" y="240" width="280" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1070" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">pidlock · 单实例</text>
  <text x="1070" y="288" text-anchor="middle" font-size="11" fill="#64748b">flock &lt;socket&gt;.lock · 二启拒绝</text>
  <text x="1070" y="306" text-anchor="middle" font-size="11" fill="#64748b">token 校验（常数时间）</text>

  <line x1="530" y1="320" x2="530" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="538" y="346" font-size="10.5" fill="#475569">CommandHandler / EventLog seam</text>

  <!-- ============ 运行层 ============ -->
  <rect x="40" y="372" width="1200" height="296" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="54" y="386" width="86" height="24" rx="12" fill="#16a34a"/>
  <text x="97" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">运行层</text>
  <text x="150" y="402" font-size="11" fill="#15803d">每个会话一份 · 互不影响并发</text>

  <!-- scheduler -->
  <rect x="170" y="390" width="320" height="256" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="330" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">harness-scheduler</text>
  <rect x="190" y="428" width="280" height="34" rx="8" fill="#16a34a"/>
  <text x="330" y="449" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f0fdf4">每会话 1 活跃 run · 全局 ≤ 4</text>
  <text x="190" y="484" font-size="11" fill="#475569">· 每会话有界队列 · 满则 QueueFull</text>
  <text x="190" y="504" font-size="11" fill="#475569">· 槽空按全局最旧 ticket 准入</text>
  <text x="190" y="524" font-size="11" fill="#475569">· cancel · status · list · started_total</text>
  <text x="190" y="552" font-size="11" fill="#15803d">EventBus：每 run 广播 + drop 协议</text>
  <text x="190" y="572" font-size="11" fill="#15803d">（最后订阅者离开 → cancel）</text>
  <rect x="190" y="586" width="280" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="330" y="606" text-anchor="middle" font-size="10.5" fill="#166534">subagent 子 run 不占槽位</text>
  <text x="330" y="622" text-anchor="middle" font-size="10.5" fill="#166534">profile 限工具子集 + max_turns</text>

  <!-- loop -->
  <rect x="540" y="390" width="330" height="256" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="705" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">harness-loop · turn 循环</text>
  <rect x="560" y="428" width="120" height="30" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="620" y="447" text-anchor="middle" font-size="10.5" font-weight="600" fill="#166534">budget gate</text>
  <line x1="680" y1="443" x2="706" y2="443" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="710" y="428" width="140" height="30" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="780" y="447" text-anchor="middle" font-size="10.5" font-weight="600" fill="#166534">LLM stream → 回灌</text>
  <line x1="780" y1="458" x2="780" y2="478" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="710" y="480" width="140" height="30" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="780" y="499" text-anchor="middle" font-size="10.5" font-weight="600" fill="#166534">policy → approval</text>
  <path d="M 710 495 L 640 495 L 640 462" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="640" y="514" text-anchor="middle" font-size="10" fill="#166534">下一轮 / 终止</text>
  <text x="560" y="540" font-size="11" fill="#475569">· steering 转向（turn 边界注入）</text>
  <text x="560" y="560" font-size="11" fill="#475569">· RunEvent seq 单调（发射侧赋值）</text>
  <text x="560" y="580" font-size="11" fill="#475569">· [budget] + compaction stage 门</text>
  <rect x="560" y="592" width="290" height="42" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="705" y="610" text-anchor="middle" font-size="10.5" fill="#b45309">budget 超限：compaction 支路</text>
  <text x="705" y="626" text-anchor="middle" font-size="10.5" fill="#b45309">压缩后重查 · 仍超则终止</text>

  <!-- tools -->
  <rect x="920" y="390" width="290" height="256" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1065" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">harness-tools</text>
  <text x="1065" y="438" text-anchor="middle" font-size="11" fill="#475569">路径容器化 · spill · result 截断</text>
  <g font-size="10.5" fill="#166534" text-anchor="middle">
    <rect x="940" y="450" width="84" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="982" y="467">read</text>
    <rect x="1032" y="450" width="84" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1074" y="467">write</text>
    <rect x="1124" y="450" width="66" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1157" y="467">edit</text>
    <rect x="940" y="484" width="84" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="982" y="501">glob</text>
    <rect x="1032" y="484" width="84" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1074" y="501">grep</text>
    <rect x="1124" y="484" width="66" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1157" y="501">skill</text>
    <rect x="940" y="518" width="120" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1000" y="535">terminal</text>
    <rect x="1068" y="518" width="122" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1129" y="535">webfetch</text>
  </g>
  <rect x="940" y="554" width="250" height="30" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="1065" y="573" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">MCP 桥（mcp__*）</text>
  <rect x="940" y="592" width="250" height="42" rx="8" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5 3"/>
  <text x="1065" y="610" text-anchor="middle" font-size="10.5" fill="#166534">ToolCatalog：per-session allowlist</text>
  <text x="1065" y="626" text-anchor="middle" font-size="10.5" fill="#166534">tools.list / set_active / reset</text>

  <line x1="490" y1="470" x2="538" y2="470" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="514" y="462" text-anchor="middle" font-size="10" fill="#15803d">run</text>
  <line x1="870" y1="470" x2="918" y2="470" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="894" y="462" text-anchor="middle" font-size="10" fill="#15803d">tools</text>
  <line x1="490" y1="600" x2="538" y2="600" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
  <text x="514" y="622" text-anchor="middle" font-size="10" fill="#15803d">subagent</text>

  <!-- ============ 存储层 ============ -->
  <rect x="40" y="696" width="1200" height="138" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="54" y="710" width="86" height="24" rx="12" fill="#d97706"/>
  <text x="97" y="726" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">存储层</text>

  <rect x="170" y="710" width="500" height="108" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="420" y="736" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">harness-session</text>
  <text x="420" y="758" text-anchor="middle" font-size="11" fill="#475569">Turso（libsql 嵌入式）账本：sessions / messages / run_events</text>
  <text x="420" y="778" text-anchor="middle" font-size="11" fill="#475569">幂等键 UNIQUE · 重启重放水合 · pump spawn_blocking 落盘</text>
  <text x="420" y="800" text-anchor="middle" font-size="11" fill="#475569">petgraph 内存图索引（O(N) 重建 + 增量）· recall FTS 检索</text>

  <rect x="720" y="710" width="490" height="108" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="965" y="736" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">harness-context · 上下文构建</text>
  <text x="965" y="758" text-anchor="middle" font-size="11" fill="#475569">Budget（token 预算）· Compactor（分级压缩策略）</text>
  <text x="965" y="778" text-anchor="middle" font-size="11" fill="#475569">stage 阈值：reduce / snip / microcompact / collapse / auto</text>
  <text x="965" y="800" text-anchor="middle" font-size="11" fill="#475569">hysteresis 高低水位 · 防前缀缓存 churn</text>

  <line x1="330" y1="646" x2="330" y2="708" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="338" y="680" font-size="10.5" fill="#b45309">pump 持久化 RunEvent</text>
  <line x1="705" y1="646" x2="705" y2="708" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-amber)"/>
  <text x="713" y="680" font-size="10.5" fill="#b45309">budget / compactor 注入</text>

  <!-- ============ core 冻结层 ============ -->
  <rect x="40" y="868" width="1200" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="54" y="882" width="150" height="24" rx="12" fill="#2563eb"/>
  <text x="129" y="898" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">core 冻结契约层</text>
  <text x="230" y="896" font-size="11.5" fill="#1d4ed8">harness-core · #[non_exhaustive] — 新变体需维护者批准</text>
  <text x="230" y="918" font-size="11" fill="#475569">Model · Tool · ToolPolicy / ApprovalBroker · RunControl（cancel + steering）</text>
  <text x="230" y="936" font-size="11" fill="#475569">RunEvent / EventSink（seq 发射侧）· RunStopReason / RunEventKind · SessionStore seam</text>

  <!-- ============ 装配层 → 运行层注入箭头 ============ -->
  <path d="M 595 194 L 595 210 L 1065 210 L 1065 388" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-purple)"/>
  <text x="840" y="204" text-anchor="middle" font-size="10" fill="#7c3aed">tools · model · policy · limits 注入运行层</text>

  <!-- ============ 图例 ============ -->
  <text x="40" y="978" font-size="10.5" fill="#94a3b8">紫 = 装配层（启动一次性）· 天蓝 = 传输层 · 绿 = 运行层（每会话）· 橙 = 存储层 · 蓝 = core 冻结契约</text>
  <text x="40" y="998" font-size="10.5" fill="#94a3b8">实线 = 运行时数据流 · 虚线 = 启动注入 / 分级支路 · 旧图 harness-daemon-model.svg 保留对照</text>
</svg>
