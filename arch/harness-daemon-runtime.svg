<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1440" height="1180" fill="#f8fafc" rx="18"/>

  <text x="720" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Harness Daemon 运行时现状（2026-11-15 审计）</text>
  <text x="720" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">绿 = 已接线并可用 · 灰 = 库能力存在但运行时未接线 · 红 = 审计缺陷 D#（详见 docs/daemon-runtime-wiring-audit.md）</text>

  <!-- ============ 装配层 ============ -->
  <rect x="40" y="80" width="1360" height="150" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="54" y="92" width="86" height="24" rx="12" fill="#7c3aed"/>
  <text x="97" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">装配层</text>
  <text x="152" y="108" font-size="11" fill="#7c3aed">启动一次性：config → spec → 显式注入</text>

  <rect x="170" y="122" width="230" height="62" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="285" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">harness-config</text>
  <text x="285" y="166" text-anchor="middle" font-size="10.5" fill="#475569">TOML + env → typed Config</text>

  <rect x="430" y="122" width="300" height="62" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="580" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">harness-builder</text>
  <text x="580" y="166" text-anchor="middle" font-size="10.5" fill="#475569">validate → analyze（拓扑序）→ assemble</text>

  <rect x="760" y="122" width="210" height="62" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="865" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">harness-model</text>
  <text x="865" y="166" text-anchor="middle" font-size="10.5" fill="#475569">OpenAI SSE 适配器</text>

  <rect x="1000" y="122" width="210" height="62" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1105" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">harness-mcp</text>
  <text x="1105" y="166" text-anchor="middle" font-size="10.5" fill="#475569">JSON-RPC / stdio / HTTP</text>

  <text x="580" y="204" text-anchor="middle" font-size="10.5" fill="#475569">daemon spec = 模型 aliases + 7 个内建工具 + 可选 subagent</text>
  <text x="1080" y="204" text-anchor="middle" font-size="10.5" font-weight="600" fill="#dc2626">prompt sections / skills / MCP servers 未声明 → ⛔ D2</text>

  <!-- ============ 传输层 ============ -->
  <rect x="40" y="250" width="1360" height="110" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="54" y="262" width="86" height="24" rx="12" fill="#0284c7"/>
  <text x="97" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">传输层</text>

  <rect x="170" y="264" width="760" height="76" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="550" y="288" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0369a1">harness-transport · 三通道同一 parse → dispatch → push</text>
  <rect x="190" y="300" width="220" height="28" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="300" y="318" text-anchor="middle" font-size="10.5" fill="#0369a1">HTTP · POST /command + SSE /events</text>
  <rect x="430" y="300" width="220" height="28" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="540" y="318" text-anchor="middle" font-size="10.5" fill="#0369a1">WS · /ws subscribe + replay</text>
  <rect x="670" y="300" width="240" height="28" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="790" y="318" text-anchor="middle" font-size="10.5" fill="#0369a1">UDS · NDJSON control plane</text>

  <rect x="960" y="264" width="270" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1095" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">pidlock · 单实例</text>
  <text x="1095" y="308" text-anchor="middle" font-size="10.5" fill="#64748b">flock &lt;socket&gt;.lock · 二启拒绝</text>
  <text x="1095" y="326" text-anchor="middle" font-size="10.5" fill="#64748b">UDS token 常数时间比较</text>

  <line x1="550" y1="340" x2="550" y2="390" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="558" y="354" font-size="10" fill="#475569">CommandHandler / EventLog seam</text>

  <!-- ============ 运行层 ============ -->
  <rect x="40" y="380" width="1360" height="340" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="54" y="392" width="86" height="24" rx="12" fill="#16a34a"/>
  <text x="97" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">运行层</text>

  <!-- scheduler -->
  <rect x="170" y="402" width="330" height="300" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="335" y="426" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">harness-scheduler</text>
  <rect x="190" y="438" width="290" height="32" rx="8" fill="#16a34a"/>
  <text x="335" y="458" text-anchor="middle" font-size="11" font-weight="600" fill="#f0fdf4">每会话 1 活跃 run · 全局 ≤ 4</text>
  <text x="190" y="494" font-size="10.5" fill="#475569">· 每会话有界队列（默认 4）· 满则 QueueFull</text>
  <text x="190" y="514" font-size="10.5" fill="#475569">· 槽空按全局最旧 ticket 准入</text>
  <text x="190" y="534" font-size="10.5" fill="#475569">· cancel · status · list · started_total</text>
  <text x="190" y="560" font-size="10.5" fill="#15803d">EventBus：每 run 广播 + drop 协议</text>
  <text x="190" y="580" font-size="10.5" fill="#15803d">最后订阅者离开 → cancel</text>
  <rect x="190" y="596" width="290" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="335" y="615" text-anchor="middle" font-size="10" fill="#166534">subagent 子 run 不占槽位</text>
  <text x="335" y="633" text-anchor="middle" font-size="10" fill="#166534">profile 限工具子集 + max_turns</text>

  <!-- loop -->
  <rect x="540" y="402" width="380" height="300" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="730" y="426" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">harness-loop · turn 循环</text>
  <rect x="560" y="438" width="120" height="28" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="620" y="456" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">turn 边界</text>
  <line x1="682" y1="452" x2="698" y2="452" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="700" y="438" width="200" height="28" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="800" y="456" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">LLM stream → 回灌</text>
  <line x1="800" y1="468" x2="800" y2="476" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="700" y="478" width="200" height="28" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="800" y="496" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">policy → approval → 工具</text>
  <text x="560" y="536" font-size="10.5" fill="#dc2626">· 起始 transcript 为空 → ⛔ D4 历史不重放</text>
  <text x="560" y="556" font-size="10.5" fill="#dc2626">· steering 邮箱已实现；daemon 未接 ⛔ D6</text>
  <text x="560" y="576" font-size="10.5" fill="#475569">· RunEvent seq 单调（发射侧赋值）</text>
  <rect x="560" y="592" width="340" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="730" y="612" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">budget gate：需要 Compactor</text>
  <text x="730" y="630" text-anchor="middle" font-size="10" fill="#64748b">当前无具体实现 → 门永不触发 ⛔ D3</text>

  <!-- tools -->
  <rect x="960" y="402" width="400" height="300" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1160" y="426" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">harness-tools</text>
  <text x="1160" y="446" text-anchor="middle" font-size="10.5" fill="#475569">路径容器化 · spill · result 截断</text>
  <g font-size="10" fill="#166534" text-anchor="middle">
    <rect x="970" y="458" width="80" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1010" y="475">read</text>
    <rect x="1056" y="458" width="80" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1096" y="475">write</text>
    <rect x="1142" y="458" width="66" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1175" y="475">edit</text>
    <rect x="1214" y="458" width="70" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1249" y="475">glob</text>
    <rect x="970" y="492" width="80" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1010" y="509">grep</text>
    <rect x="1056" y="492" width="100" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1106" y="509">terminal</text>
    <rect x="1162" y="492" width="100" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1212" y="509">webfetch</text>
  </g>
  <rect x="970" y="530" width="200" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="1070" y="547" text-anchor="middle" font-size="10" fill="#166534">subagent（按配置注入）</text>
  <rect x="970" y="566" width="300" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="1120" y="583" text-anchor="middle" font-size="10" fill="#64748b">skill：spec 未声明 ⛔ D2</text>
  <rect x="970" y="602" width="300" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="1120" y="619" text-anchor="middle" font-size="10" fill="#64748b">MCP 桥 mcp__*：spec 无声明，池为空 ⛔ D2</text>
  <text x="1160" y="652" text-anchor="middle" font-size="10" fill="#15803d">ToolCatalog：per-session allowlist 已生效</text>

  <line x1="500" y1="520" x2="538" y2="520" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="520" y="512" text-anchor="middle" font-size="9.5" fill="#15803d">run</text>
  <line x1="920" y1="520" x2="958" y2="520" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="939" y="512" text-anchor="middle" font-size="9.5" fill="#15803d">tools</text>
  <line x1="500" y1="660" x2="538" y2="660" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
  <text x="520" y="680" text-anchor="middle" font-size="9.5" fill="#15803d">subagent</text>

  <!-- ============ 存储层 ============ -->
  <rect x="40" y="740" width="1360" height="160" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="54" y="752" width="86" height="24" rx="12" fill="#d97706"/>
  <text x="97" y="768" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">存储层</text>

  <rect x="170" y="754" width="720" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="530" y="780" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">harness-session（Turso / libsql 嵌入式）</text>
  <text x="530" y="804" text-anchor="middle" font-size="10.5" fill="#475569">sessions ✅ · run_events ✅（pump 异步落盘）· messages ⛔ D4 无写入者</text>
  <text x="530" y="826" text-anchor="middle" font-size="10.5" fill="#475569">幂等键 UNIQUE ✅ · recall FTS（ngram）✅ · GraphIndex ⛔ D5 无消费者</text>
  <text x="530" y="848" text-anchor="middle" font-size="10.5" fill="#dc2626">重启重放水合 ⛔ 未实现：start_run 不调用 replay_ledger</text>
  <text x="530" y="866" text-anchor="middle" font-size="9.5" fill="#64748b">单连接 + tokio::Mutex 门；append_message 独立连接 + BEGIN IMMEDIATE</text>

  <rect x="920" y="754" width="440" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="1140" y="780" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">harness-context</text>
  <text x="1140" y="804" text-anchor="middle" font-size="10.5" fill="#475569">Budget ✅ · 五级阈值 60/70/80/90/95%</text>
  <text x="1140" y="826" text-anchor="middle" font-size="10.5" fill="#dc2626">Compactor ⛔ D3 无具体实现 → 门不触发</text>
  <text x="1140" y="848" text-anchor="middle" font-size="10.5" fill="#475569">checkpoint / BudgetBlocked 已定义</text>
  <text x="1140" y="870" text-anchor="middle" font-size="10" fill="#64748b">待接：DefaultCompactor → with_compactor</text>

  <line x1="335" y1="702" x2="335" y2="752" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="343" y="732" font-size="10" fill="#b45309">pump 持久化 RunEvent</text>

  <!-- ============ core 冻结层 ============ -->
  <rect x="40" y="920" width="1360" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="54" y="932" width="150" height="24" rx="12" fill="#2563eb"/>
  <text x="129" y="949" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">core 冻结契约层</text>
  <text x="720" y="950" text-anchor="middle" font-size="11" fill="#1d4ed8">Message · Model · Tool · ToolPolicy / ApprovalBroker · RunControl（cancel + steering）· RunEvent / EventSink · RunStopReason</text>
  <text x="720" y="974" text-anchor="middle" font-size="10.5" fill="#dc2626">修正 D7：SessionStore seam 在 harness-session，不在 core</text>
  <text x="720" y="996" text-anchor="middle" font-size="10" fill="#64748b">#[non_exhaustive] · 新变体需维护者批准</text>

  <!-- ============ 参考项目汲取 ============ -->
  <rect x="40" y="1030" width="1360" height="130" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="60" y="1054" font-size="13" font-weight="700" fill="#0f172a">参考项目汲取 → 铺路顺序</text>
  <text x="60" y="1072" font-size="10" fill="#64748b">harness-rs · pi · oh-my-pi 的共同做法；详细对照见 docs/daemon-runtime-wiring-audit.md</text>

  <rect x="60" y="1082" width="320" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="76" y="1102" font-size="11" font-weight="700" fill="#15803d">P1 会话历史（先做）</text>
  <text x="76" y="1120" font-size="9.5" fill="#475569">账本 → seed 进新 run；三家共识</text>
  <text x="76" y="1137" font-size="9.5" fill="#64748b">harness-rs seed · pi readContext · omp leaf</text>

  <rect x="400" y="1082" width="320" height="66" rx="8" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="416" y="1102" font-size="11" font-weight="700" fill="#6d28d9">P2 config → spec</text>
  <text x="416" y="1120" font-size="9.5" fill="#475569">prompt / skills / MCP 真正装配</text>
  <text x="416" y="1137" font-size="9.5" fill="#64748b">pi system-prompt · omp MCPManager</text>

  <rect x="740" y="1082" width="320" height="66" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="756" y="1102" font-size="11" font-weight="700" fill="#b45309">P3 Compactor</text>
  <text x="756" y="1120" font-size="9.5" fill="#475569">五级阈值 + 切点 + 检查点</text>
  <text x="756" y="1137" font-size="9.5" fill="#64748b">harness-rs DefaultCompactor · pi Task</text>

  <rect x="1080" y="1082" width="300" height="66" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="1096" y="1102" font-size="11" font-weight="700" fill="#0369a1">P4 steering handle</text>
  <text x="1096" y="1120" font-size="9.5" fill="#475569">队列 + turn 边界 drain</text>
  <text x="1096" y="1137" font-size="9.5" fill="#64748b">pi / omp 的 steer + followUp</text>
</svg>
