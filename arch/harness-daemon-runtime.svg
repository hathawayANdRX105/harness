<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="g-run" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="g-data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/><stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="g-acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="g-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="1080" fill="#f8fafc" rx="18"/>

  <text x="640" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Harness Daemon 运行时架构 — v1 实现</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#64748b">单进程 · 多 Tokio Task · 边界接入 / 运行时机制 / 会话持久化 / 启动装配 · 静态图（旧图 harness-daemon-model.svg 保留对照）</text>

  <!-- ============ ① 边界层 ============ -->
  <text x="40" y="96" font-size="12.5" font-weight="700" fill="#0369a1">① 边界层 · 外界连接</text>

  <rect x="340" y="82" width="270" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="650" y="82" width="270" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="950" y="82" width="270" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="108" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">HTTP 客户端</text>
  <text x="475" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">POST /command · GET /events</text>
  <text x="785" y="108" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">WS 长连接客户端</text>
  <text x="785" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">subscribe · replay（after_seq）</text>
  <text x="1085" y="108" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">CLI / IDE / 本机脚本</text>
  <text x="1085" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">UDS 控制面（NDJSON · 0o700）</text>

  <line x1="475" y1="154" x2="475" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="785" y1="154" x2="785" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="1085" y1="154" x2="1085" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="330" y="194" width="910" height="62" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="220" font-size="13" font-weight="700" fill="#0369a1">harness-transport · 三通道同一 parse → dispatch → push</text>
  <text x="350" y="242" font-size="11" fill="#475569">slash 命令解析 · 类型化 JSON-RPC 错误帧 · SSE run_id 过滤 + connected 帧 · WS subscribe/replay · UDS 常数时间 token 校验</text>
  <text x="1220" y="220" text-anchor="end" font-size="10.5" fill="#0369a1">CommandHandler / EventLog seam</text>

  <rect x="40" y="194" width="260" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="220" font-size="12" font-weight="600" fill="#991b1b">pid lock（单实例）</text>
  <text x="56" y="242" font-size="10.5" fill="#64748b">flock &lt;socket&gt;.lock · 二启拒绝 · 退出释放</text>
  <line x1="300" y1="225" x2="326" y2="225" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>

  <!-- ============ ② 运行层 ============ -->
  <text x="40" y="292" font-size="12.5" font-weight="700" fill="#15803d">② 运行层 · 内部机制</text>

  <rect x="330" y="280" width="910" height="366" rx="16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="346" y="302" font-size="12.5" font-weight="600" fill="#334155">harness-daemon（单 OS 进程 · clap CLI · graceful drain）</text>

  <!-- Scheduler -->
  <rect x="350" y="314" width="380" height="136" rx="10" fill="url(#g-run)" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="368" y="338" font-size="13" font-weight="700" fill="#15803d">harness-scheduler · 单活跃 run</text>
  <rect x="368" y="348" width="50" height="24" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <rect x="426" y="348" width="50" height="24" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <rect x="484" y="348" width="50" height="24" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="556" y="365" font-size="10.5" fill="#475569">有界队列 · 满则显式 QueueFull</text>
  <rect x="368" y="380" width="250" height="32" rx="6" fill="#16a34a"/>
  <text x="493" y="401" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f0fdf4">ACTIVE RUN（同时仅一个）</text>
  <text x="368" y="432" font-size="10.5" fill="#475569">drop 协议：最后订阅者离开 → cancel</text>
  <text x="368" y="446" font-size="10.5" fill="#475569">cancel · status · list · started_total</text>

  <line x1="730" y1="382" x2="786" y2="382" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Loop -->
  <rect x="790" y="314" width="435" height="136" rx="10" fill="url(#g-run)" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="338" font-size="13" font-weight="700" fill="#15803d">harness-loop · turn 循环</text>
  <rect x="808" y="348" width="92" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="854" y="370" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">budget gate</text>
  <line x1="900" y1="365" x2="948" y2="365" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="952" y="348" width="92" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="998" y="370" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">LLM stream</text>
  <line x1="1044" y1="365" x2="1092" y2="365" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="1096" y="348" width="112" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="1152" y="370" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">policy → approval</text>
  <line x1="1152" y1="382" x2="1152" y2="400" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="1096" y="402" width="112" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="1152" y="424" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">tools 执行 → 回灌</text>
  <path d="M 1096 419 L 1000 419" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="990" y="414" text-anchor="end" font-size="10" fill="#166534">下一轮 / 终止</text>
  <text x="808" y="440" font-size="10" fill="#475569">RunEvent seq 0..n 单调（发射侧赋值 · scheduler 保持）</text>

  <!-- budget gate 的两个出口：compaction 支路 + BudgetBlocked -->
  <line x1="854" y1="382" x2="854" y2="440" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-orange)"/>
  <rect x="808" y="444" width="200" height="30" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="908" y="464" text-anchor="middle" font-size="10" fill="#b45309">compaction 支路（stage 激活时压缩后重查）</text>
  <path d="M 854 444 L 854 474 L 770 474" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>
  <rect x="600" y="460" width="166" height="28" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="683" y="479" text-anchor="middle" font-size="10" fill="#b91c1c">BudgetBlocked → 终止</text>
  <text x="683" y="497" text-anchor="middle" font-size="9.5" fill="#b91c1c">Error 消息可恢复解析（core 变体待批）</text>

  <!-- tools strip -->
  <rect x="350" y="524" width="875" height="66" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="368" y="546" font-size="12" font-weight="700" fill="#15803d">harness-tools · LoopDeps.tools（skill = 工具调用激活）</text>
  <g font-size="10" fill="#166534" text-anchor="middle">
    <rect x="368" y="554" width="88" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="412" y="571">read</text>
    <rect x="464" y="554" width="88" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="508" y="571">write</text>
    <rect x="560" y="554" width="88" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="604" y="571">edit</text>
    <rect x="656" y="554" width="88" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="700" y="571">glob</text>
    <rect x="752" y="554" width="88" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="796" y="571">grep</text>
    <rect x="848" y="554" width="88" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="892" y="571">skill</text>
    <rect x="944" y="554" width="120" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="1004" y="571">MCP 桥（mcp__*）</text>
  </g>
  <text x="1080" y="571" font-size="9.5" fill="#64748b">路径容器化 · spill</text>
  <line x1="1007" y1="450" x2="1007" y2="520" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1014" y="492" font-size="10" fill="#15803d">LoopDeps.tools</text>

  <!-- ============ ③ 数据层 ============ -->
  <text x="40" y="700" font-size="12.5" font-weight="700" fill="#b45309">③ 数据层 · 会话持久化</text>

  <line x1="545" y1="590" x2="545" y2="712" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="553" y="600" font-size="10.5" fill="#b45309">pump 持久化每个 RunEvent（spawn_blocking）</text>
  <text x="553" y="618" font-size="10.5" fill="#b45309">run 开始/终止记账 · 重启后 list() 水合历史 run</text>

  <rect x="350" y="716" width="400" height="120" rx="10" fill="url(#g-data)" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="368" y="742" font-size="13" font-weight="700" fill="#b45309">harness-session · SessionStore port trait（async）</text>
  <text x="368" y="766" font-size="11" fill="#78350f">Turso（libsql 0.8.3-pre.1 嵌入式）— PR #19 已实现</text>
  <text x="368" y="786" font-size="11" fill="#78350f">sessions / messages / run_events（idempotency_key UNIQUE）</text>
  <text x="368" y="806" font-size="11" fill="#78350f">恢复 = 账本重放 + seq 检洞 · 断线重连走 seam 补发</text>
  <text x="368" y="826" font-size="10" fill="#b45309">port 后端可替换（ferrite app-db 同款 feature 门模式）</text>

  <rect x="790" y="716" width="425" height="120" rx="10" fill="url(#g-data)" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="742" font-size="13" font-weight="700" fill="#b45309">petgraph 内存图索引 — PR #19 已实现</text>
  <text x="808" y="766" font-size="11" fill="#78350f">节点 = user prompt / agent response 单元 + 顺序边</text>
  <text x="808" y="786" font-size="11" fill="#78350f">从 ledger 全量重建（O(N)）+ 追加时增量更新 · 永不落盘</text>
  <text x="808" y="806" font-size="11" fill="#78350f">unit → (run_id, seq) 映射内容查询 · 消息体不进图</text>
  <text x="808" y="826" font-size="10" fill="#b45309">FTS5 在 turso 0.8 不可用（ferrite 探针）— 全文检索待议</text>

  <!-- ============ 左列：装配流 ============ -->
  <text x="40" y="316" font-size="12.5" font-weight="700" fill="#6d28d9">⓪ 装配流 · 启动一次性</text>

  <rect x="40" y="328" width="245" height="118" rx="10" fill="url(#g-acc)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="162" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">harness-config</text>
  <text x="162" y="372" text-anchor="middle" font-size="10.5" fill="#475569">$HARNESS_CONFIG &gt; XDG &gt; $HOME</text>
  <text x="162" y="388" text-anchor="middle" font-size="10.5" fill="#475569">toml + env 表驱动覆盖</text>
  <text x="162" y="404" text-anchor="middle" font-size="10.5" fill="#475569">typed 三类错误 · migration hook</text>
  <text x="162" y="420" font-size="10" fill="#7c3aed">密钥只存变量名（掩码 Debug）</text>

  <line x1="162" y1="446" x2="162" y2="470" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

  <rect x="40" y="474" width="245" height="140" rx="10" fill="url(#g-acc)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="162" y="498" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">harness-builder</text>
  <text x="162" y="518" text-anchor="middle" font-size="10.5" fill="#475569">HarnessSpec → analyze（拓扑序）</text>
  <text x="162" y="534" text-anchor="middle" font-size="10.5" fill="#475569">→ assemble → explain 干跑</text>
  <text x="162" y="550" text-anchor="middle" font-size="10.5" fill="#475569">显式注入 · 无 coding fallback</text>
  <text x="162" y="566" text-anchor="middle" font-size="10.5" fill="#475569">五内置工具 + skill 激活 + MCP 桥</text>
  <text x="162" y="582" text-anchor="middle" font-size="10.5" fill="#475569">budget/compactor → LoopDeps</text>
  <text x="162" y="600" font-size="10" fill="#7c3aed">重复工具名 → DuplicateTool</text>

  <line x1="162" y1="614" x2="162" y2="638" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-purple)"/>

  <rect x="40" y="642" width="245" height="76" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="162" y="668" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">harness-daemon 组装</text>
  <text x="162" y="690" text-anchor="middle" font-size="10.5" fill="#475569">clap CLI · 三通道启动 · graceful drain</text>
  <text x="162" y="708" text-anchor="middle" font-size="10.5" fill="#475569">session store 接线（下一个 PR）</text>

  <line x1="285" y1="544" x2="326" y2="544" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-purple)"/>
  <text x="290" y="536" font-size="10" fill="#7c3aed">注入</text>

  <!-- ============ 底部：core 冻结层 + 规划 ============ -->
  <rect x="330" y="880" width="910" height="70" rx="10" fill="url(#g-core)" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="906" font-size="12.5" font-weight="700" fill="#1d4ed8">harness-core · 契约冻结层（#[non_exhaustive] 扩展点）</text>
  <text x="350" y="928" font-size="11" fill="#475569">Model · Tool · ToolPolicy/ApprovalBroker · RunControl(cancel + steering) · RunEvent/EventSink(seq 发射侧) · SessionStore seam</text>
  <text x="350" y="944" font-size="9.5" fill="#94a3b8">RunStopReason / RunEventKind 冻结 — 新变体（如 BudgetBlocked）需维护者批准后加入</text>

  <rect x="40" y="880" width="260" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="56" y="904" font-size="11" font-weight="600" fill="#475569">已规划 / 讨论中</text>
  <text x="56" y="922" font-size="10" fill="#64748b">RunStopReason::BudgetBlocked 变体（待批）</text>
  <text x="56" y="938" font-size="10" fill="#64748b">session→latest-run 解析 · RecallStore/FTS（讨论中）</text>
  <text x="56" y="952" font-size="10" fill="#64748b">terminal / subagent / webfetch 工具（v2）</text>

  <!-- 图例 -->
  <text x="40" y="1000" font-size="10.5" fill="#94a3b8">绿 = 运行时（loop/scheduler/tools）· 橙 = 数据层 · 紫 = 启动装配 · 红 = 拒绝/单实例 · 蓝 = core 契约 · 橙虚线框 = 下一个 PR</text>
  <text x="40" y="1018" font-size="10.5" fill="#94a3b8">基线：master da526b7e（#5/#7 已随 PR #18 合入）· 会话 Turso+petgraph 重做见右侧虚线框 · 旧图 harness-daemon-model.svg 保留对照</text>
</svg>
