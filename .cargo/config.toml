# harness — cargo 共享基线配置（手机 / 桌面同一份, 不写死任何本机工具）。
#
# 设计原则：本文件只放"任何机器都能跑"的通用基线。会因机器而异的优化
# （sccache 缓存、mold 链接器）不写死在这里——没有该工具的机器会因为
# cargo 启动时找不到 wrapper / 链接器而直接报错。
# 优化改为按机器能力**探测式注入**：见 scripts/dev-env.sh，source 进
# shell 后用 env var 覆盖（env 优先级 > 本文件）。桌面有 sccache/mold
# 就启用, termux 探测失败则什么也不注入, 自动裸跑。
[build]
# Concurrent-session ceiling: each cargo process runs at most 6 parallel units.
# 上限语义: 核数少的机器不会超, 手机上也不会塞爆。
jobs = 6
