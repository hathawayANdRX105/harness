[package]
name = "harness-store"
version = "0.1.0"
edition = "2024"
description = "Turso-backed storage adapter for the harness session port: TursoSessionStore, the FTS recall handle, the in-memory graph shadow, and the versioned migration runner — assembled behind the harness-session port traits. No storage-engine type crosses the crate boundary."
license = "MIT"
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
harness-session = { path = "../harness-session" }
async-trait = "0.1"
petgraph = "0.6"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"
turso = { version = "0.8.3-pre.1" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

[lints]
workspace = true
