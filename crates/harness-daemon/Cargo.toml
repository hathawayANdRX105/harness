[package]
name = "harness-daemon"
version = "0.1.0"
edition = "2024"
description = "Process entry for the harness daemon: single-instance pid lock, transport wiring for UDS / HTTP+SSE / WS, and graceful shutdown"
license = "MIT"
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
harness-config = { path = "../harness-config" }
harness-builder = { path = "../harness-builder" }
harness-model = { path = "../harness-model" }
harness-loop = { path = "../harness-loop" }
harness-scheduler = { path = "../harness-scheduler" }
harness-session = { path = "../harness-session" }
harness-transport = { path = "../harness-transport" }
# tokio: the daemon owns the runtime — transport servers, signal watchers and
# the event pump all live on it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync", "fs"] }
# futures: block_on for driving the async session store from the sync
# CommandHandler seam.
futures = "0.3"
# async-trait: implement the transport EventLog trait (async fn) on the sync
# CommandHandler seam.
async-trait = "0.1"
# clap: the daemon's CLI surface (--config/--socket/--http) — declarative
# args with free --help/--version and typed value parsing.
clap = { version = "4", features = ["derive"] }
# anyhow: flattens the daemon's startup error chain (config/builder/pidlock/
# io) into one report; crate-boundary errors stay typed in their own crates.
anyhow = "1"
# axum serves the merged HTTP+SSE + WS router the transport crate builds.
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# tokio-util: CancellationToken appears in the Tool trait signature the
# daemon's subagent tool implements (and the test stubs use).
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
# The smoke test sends SIGTERM to the daemon child process.
libc = "0.2"
# tokio-util: CancellationToken for the test-only stub Tool impls in the
# daemon's tests and cfg(test) modules.
tokio-util = { version = "0.7", default-features = false }

[lints]
workspace = true
