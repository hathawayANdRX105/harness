[package]
name = "harness-daemon"
version = "0.1.0"
edition = "2024"
description = "Process entry for the harness daemon: single-instance pid lock, transport wiring for UDS / HTTP+SSE / WS, and graceful shutdown"
license = "MIT"
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
harness-config = { path = "../harness-config" }
harness-builder = { path = "../harness-builder" }
harness-model = { path = "../harness-model" }
harness-loop = { path = "../harness-loop" }
harness-scheduler = { path = "../harness-scheduler" }
harness-transport = { path = "../harness-transport" }
# tokio: the daemon owns the runtime — transport servers, signal watchers and
# the event pump all live on it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync", "fs"] }
# axum serves the merged HTTP+SSE + WS router the transport crate builds.
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# The smoke test sends SIGTERM to the daemon child process.
libc = "0.2"

[lints]
workspace = true
