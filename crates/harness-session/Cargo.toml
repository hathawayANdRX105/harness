[package]
name = "harness-session"
version = "0.1.0"
edition = "2024"
description = "The session persistence port: SessionStore and RecallStore traits, the unit-ledger domain model (split/assemble, rewind markers, integrity hash), and replay semantics. Storage engines live in adapter crates (harness-storage)."
license = "MIT"
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[lints]
workspace = true
