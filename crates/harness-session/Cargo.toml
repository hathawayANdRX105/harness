[package]
name = "harness-session"
version = "0.1.0"
edition = "2024"
description = "Session persistence: message ledger (replayable with None-section removal) and ordered RunEvent log over Turso (libsql). Design provenance: pi's committed-ledger pattern and NanoHarness's RunContext/RunCheckpoint split."
license = "MIT"
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
async-trait = "0.1"
petgraph = "0.6"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
turso = { version = "0.8.3-pre.1" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
