[package]
name = "harness-loop"
version = "0.1.0"
edition = "2024"
description = "Harness agent loop: model stream -> tool dispatch -> turn loop, with pi-style hooks and no persistent engine state."
license = "MIT"
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
# Sole consumer: `src/budget.rs` — the turn-boundary budget gate reads the
# compactor's view of the transcript. Capability adapters stay out of this
# crate on purpose; hosts register processors that need them via the
# builder's `with_processor`.
harness-context = { path = "../harness-context" }
async-trait = "0.1"
# Sole consumer: `src/processors/pump.rs` — one partial-JSON parse per tool
# call as the model stream arrives.
serde_json = "1"
# macros only: `tokio::select!` races the model stream against the cancel
# token in pump_stream; the loop itself stays runtime-agnostic.
tokio = { version = "1", default-features = false, features = ["macros"] }
futures = { version = "0.3", default-features = false, features = [
    "std",
    "async-await",
] }

[dev-dependencies]
harness-core = { path = "../harness-core" }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", default-features = false, features = [] }
async-trait = "0.1"

[lints]
workspace = true
