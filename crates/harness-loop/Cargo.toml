[package]
name = "harness-loop"
version = "0.1.0"
edition = "2024"
description = "Harness agent loop: model stream -> tool dispatch -> turn loop, with pi-style hooks and no persistent engine state."
license = "MIT"
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
harness-context = { path = "../harness-context" }
async-trait = "0.1"
serde_json = "1"
# macros only: `tokio::select!` races the model stream against the cancel
# token in pump_stream; the loop itself stays runtime-agnostic.
tokio = { version = "1", default-features = false, features = ["macros"] }
futures = { version = "0.3", default-features = false, features = [
    "std",
    "async-await",
] }

[dev-dependencies]
harness-core = { path = "../harness-core" }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", default-features = false, features = [] }
async-trait = "0.1"

[lints]
workspace = true
