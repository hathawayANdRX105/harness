[package]
name = "harness-context"
version = "0.1.0"
edition = "2024"
description = "Context management and compaction for the harness loop: Compactor trait, Budget, CompactionStage, BudgetBlocked stop reason, cancellable/checkpointed compaction — designed from harness-rs's compactor and pi's durable context"
license = "MIT"
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures-core = "0.3"
thiserror = "2"
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[lints]
workspace = true
