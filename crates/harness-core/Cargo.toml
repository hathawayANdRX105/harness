[package]
name = "harness-core"
version = "0.1.0"
edition = "2024"
description = "Harness core: the cross-crate vocabulary and trait hub every harness crate stands on"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures-core = "0.3"
parking_lot = "0.12"

# Integration tests compile as separate crates: only dev-deps reach tests/.
[dev-dependencies]
serde_json = "1"
async-trait = "0.1"
futures = "0.3"

[lints]
workspace = true
