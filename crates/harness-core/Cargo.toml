[package]
name = "harness-core"
version = "0.1.0"
edition = "2024"
description = "Harness core: run lifecycle, message model, model stream contract, tool contract, policy/approval, ordered run events, run control — designed from pi / nanoharness / harness-rs"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures-core = "0.3"
parking_lot = "0.12"
thiserror = "2"
# Only `sync::CancellationToken` — no runtime, no reactor: the await-able
# cancellation surface every run needs (the fix for harness-rs's documented
# one-way, loop-scoped token).
tokio-util = { version = "0.7", default-features = false }

# Integration tests compile as separate crates: only dev-deps reach tests/.
[dev-dependencies]
serde_json = "1"
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"

[lints]
workspace = true
