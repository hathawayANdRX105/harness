[package]
name = "harness-scheduler"
version = "0.1.0"
edition = "2024"
description = "Run scheduler: v1 single active run, per-run cancellation, and a bounded event bus that fans loop events out to many subscribers without back-pressuring the loop"
license = "MIT"
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
harness-loop = { path = "../harness-loop" }
# tokio: per-run tasks, bounded broadcast channels, cancellation timers in the
# approval-race test. The scheduler *is* runtime-bound — it owns the tasks.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
# CancellationToken in the mock tool / broker signatures.
tokio-util = { version = "0.7", default-features = false }

[lints]
workspace = true
