# nextest 配置（仓根 `.config/nextest.toml`）
#
# 为什么需要这个文件
# ------------------
# nextest 是 **process-per-test**：每个测试用例独立起一个进程（官方设计，见
# nextest 文档 "Why process-per-test?"）。这与 `cargo test` 的 shared-process
# 模型根本不同：同一个 test binary 内的用例不再共享进程，进程内互斥量
# （`static SERIAL` 之类）跨用例失效，nextest 也会并行跑不同 test binary。
#
# 若将来出现「共享资源被并行测试插行」的问题（例如共享文件 / 端口 / mock
# LSP 服务），用 nextest 的 **test group** 把相关测试归入单线程组：
# test group 是 nextest 的跨进程互斥机制（需 nextest >= 0.9.48）。
#
# harn 目前的测试是纯单元 / 集成 / TUI smoke，无共享数据库，暂不需要
# test-group；保留本文件作为框架与说明。

# [test-groups]
# serial = { max-threads = 1 }

# [[profile.default.overrides]]
# filter = 'package(harn-ui)'
# test-group = 'serial'
